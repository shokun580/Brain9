# Optional local database. `pnpm db:up` starts it on port 5433 so it never collides with a
# Postgres you already run on 5432.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: brain9
      POSTGRES_PASSWORD: brain9
      POSTGRES_DB: brain9_dev
    ports:
      - "5433:5432"
    volumes:
      - brain9_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brain9 -d brain9_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  brain9_pgdata:
