name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  deploy:
    name: deploy-production
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    # The "production" environment requires the team lead's approval before this job runs.
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Pinned to a major version: CLI flags have changed between majors.
      - name: Install Vercel CLI
        run: npm install --global vercel@66

      - name: Pull production settings and environment variables from Vercel
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Apply database migrations (Neon branch "production")
        env:
          BRAIN9_ENV_FILE: .vercel/.env.production.local
        run: pnpm db:deploy

      - name: Deploy
        id: deploy
        run: |
          url="$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Health check
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          curl --fail --silent --show-error --retry 6 --retry-delay 5 --retry-all-errors "$URL/api/health"
