name: Deploy staging

on:
  push:
    branches: [staging]
  workflow_dispatch:

# Never run two staging deploys at once, and never cancel one halfway through a migration.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  deploy:
    name: deploy-staging
    # Set the repository variable DEPLOY_ENABLED=true once Vercel and Neon are configured
    # (docs/deployment.md). Until then this job is skipped instead of failing.
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Pinned to a major version: CLI flags have changed between majors.
      - name: Install Vercel CLI
        run: npm install --global vercel@66

      - name: Pull staging settings and environment variables from Vercel
        run: vercel pull --yes --environment=preview --git-branch=staging --token="$VERCEL_TOKEN"

      # Always name the target. Without it Vercel may treat a deployment as production
      # (it does so for the first deployment of a project), which would put a staging
      # build on the production domain.
      - name: Build
        run: vercel build --environment=preview --token="$VERCEL_TOKEN"

      - name: Apply database migrations (Neon branch "staging")
        env:
          BRAIN9_ENV_FILE: .vercel/.env.preview.local
        run: pnpm db:deploy

      - name: Deploy
        id: deploy
        env:
          STAGING_DOMAIN: ${{ vars.STAGING_DOMAIN }}
        run: |
          url="$(vercel deploy --prebuilt --environment=preview --token="$VERCEL_TOKEN" | grep -Eo 'https://[A-Za-z0-9.-]+\.vercel\.app' | tail -1)"
          test -n "$url"
          if [ -n "$STAGING_DOMAIN" ]; then
            # Point the stable staging domain at this deployment through the REST API.
            # `vercel alias` cannot be used here: it has to load the user, and the token
            # is scoped to the team only ("User not found").
            api="https://api.vercel.com"
            auth="Authorization: Bearer $VERCEL_TOKEN"
            found="$(curl --fail-with-body -sS -H "$auth" \
              "$api/v13/deployments/${url#https://}?teamId=$VERCEL_ORG_ID")" || { echo "$found"; exit 1; }
            id="$(printf '%s' "$found" | jq -r '.id')"
            test -n "$id" && test "$id" != "null"
            curl --fail-with-body -sS -X POST -H "$auth" \
              -H "Content-Type: application/json" \
              -d "{\"alias\":\"$STAGING_DOMAIN\"}" \
              "$api/v2/deployments/$id/aliases?teamId=$VERCEL_ORG_ID"
            echo
            url="https://$STAGING_DOMAIN"
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Health check
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          curl --fail --silent --show-error --retry 6 --retry-delay 5 --retry-all-errors "$URL/api/health"
